<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array in JS</title>
</head>
<body>
    <script>
        // array
        // array : An array in JavaScript is a data structure used to store multiple values in a single variable. These values can be of any data type (numbers, strings, objects, functions, etc.).

        //Metods of Array
//         1. Insertion & Removal

// push() → add element at end

// pop() → remove element from end

// unshift() → add element at beginning

// shift() → remove element from beginning


// 2. Searching

// indexOf() → returns first index of element

// lastIndexOf() → returns last occurrence

// includes() → checks if element exists (true/false)


// 3. Transformation

// map() → creates new array by applying function

// filter() → returns elements that satisfy condition

// reduce() → reduces array to single value



// 4. Iteration

// forEach() → executes function for each element

// some() → returns true if any element satisfies condition

// every() → returns true if all elements satisfy condition




// 5. Modification

// slice() → returns a portion (does not change original array)

// splice() → adds/removes elements (modifies original array)

// concat() → merges arrays




// 6. Sorting

// sort() → sorts elements

// reverse() → reverses array




// 7. Conversion

// join() → converts array to string with separator

// toString() → converts array to string




// 8. Important Notes

// Some methods modify original array → push, pop, splice, sort

// Some methods return new array → map, filter, slice, concat

// Arrays are dynamic and flexible in JavaScript

        let subjectMarks= [23,56,45,68,84];
        console.log(subjectMarks)
    </script>
</body>
</html>
