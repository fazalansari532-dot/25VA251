        // Pending → initial state (operation not completed)

        // Fulfilled (Resolved) → operation completed successfully

        // Rejected → operation failed

        // async await : async/await is a modern way to handle asynchronous operations in JavaScript. It is built on top of Promises and makes asynchronous code look like synchronous (normal) code.

        async function userData(){
            try{
                let response=await fetch('https://dummyjson.com/products/1');
            let responseData=await response.json();
            console.log(responseData);
        }
        catch(error){
            console.log(error);
        }
    }
        userData();

        // high order function : A higher-order function is a function that takes one or more functions as arguments or returns a function as its output.

        //map : transforms each element

        let num = [3,4,5,6,7];
        let square= num.map(n=>n*2)
        console.log(square);


        //reduce : reduces array to a single value

        let sum= num.reduce((total,n) =>total+n);
        console.log(sum);

        //filter : selects elements based on condition
        // let sorting = num.filter(n=>)

       
        //foreach

        // IIFE : An IIFE is a function that is defined and executed immediately after its creation. It does not need to be called separately.

        (function(){
            console.log("Modern Js");

        }
        ) ();


        // storage

        //local storage : Local Storage is a web storage feature provided by the browser that allows you to store data in key–value pairs on the client side. The data persists even after the browser is closed and reopened.

        let userInfo={
            name : "fazal",
            age : 18,
            mob : 12345678898,
            email : "xyz@gmail.com"
        };
         
        // store the object as a JSON string
        localStorage.setItem('userInfo',JSON.stringify(userInfo));

        // retrieve the string and parse back into an object
        const saverUser=JSON.parse(localStorage.getItem('userInfo'));
        console.log(saverUser.name);
